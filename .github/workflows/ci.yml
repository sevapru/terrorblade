# Comprehensive CI pipeline for code quality, testing, and security
# Runs formatting checks, linting, type checking, tests across multiple platforms,
# and includes security scanning for a production-ready open source project
name: CI

permissions:
  contents: read
  security-events: read

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        
    - name: Install dependencies
      run: |
        uv sync --extra dev --extra security
        
    - name: Cache mypy
      uses: actions/cache@v4
      with:
        path: .mypy_cache
        key: mypy-3.13-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          mypy-3.13-
          
    - name: Run formatting checks
      run: |
        echo "::group::Black formatting check"
        uv run black --check --diff .
        echo "::endgroup::"
        
        echo "::group::isort import sorting check"
        uv run isort --check-only --diff .
        echo "::endgroup::"
        
    - name: Run linting
      run: |
        echo "::group::Ruff linting"
        uv run ruff check --fix . --output-format=github
        echo "::endgroup::"
        
        echo "::group::Pylint code quality"
        uv run pylint terrorblade --output-format=colorized || true
        echo "::endgroup::"
        
    - name: Run MyPy type checking
      if: github.event_name == 'pull_request'
      run: |
        echo "::group::MyPy type checking"
        rm -rf .mypy_cache
        uv run mypy terrorblade --exclude "tests/"
        echo "::endgroup::"
        

  format:
    name: Auto-format Code
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        
    - name: Install dependencies
      run: |
        uv sync --extra dev
        
    - name: Run auto-formatting
      run: |
        uv run make format
        
    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "style: auto-format code [skip ci]" || exit 0
        git push

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        
    - name: Install dependencies
      run: |
        uv sync --extra dev
        
    - name: Run tests
      run: |
        uv run python -m pytest tests/ -v --tb=short

