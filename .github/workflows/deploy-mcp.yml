# Deploy Terrorblade MCP Server to VPS via Tailscale
# Supports separate deployment of MCP service and/or DuckDB
name: Deploy MCP to VPS

on:
  workflow_dispatch:
    inputs:
      deploy_mcp:
        description: 'Deploy MCP service'
        required: true
        default: true
        type: boolean
      deploy_duckdb:
        description: 'Deploy DuckDB database'
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: mcp-prod
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Tailscale
        # Ephemeral node - automatically removed when CI job finishes
        # (default behavior with OAuth + tags)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:compute
          # Optional: specific Tailscale version
          # version: 1.56.1

      - name: Setup SSH connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Use Tailscale hostname - no need for ssh-keyscan with known Tailscale hosts
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync MCP service files to VPS
        if: ${{ inputs.deploy_mcp }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "__pycache__" \
            --exclude ".env" \
            --exclude ".vscode" \
            --exclude ".venv" \
            --exclude "*.db" \
            --exclude "data/" \
            -e "ssh -p $VPS_PORT -i ~/.ssh/id_ed25519" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      - name: Sync DuckDB database to VPS
        if: ${{ inputs.deploy_duckdb }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DB_PATH: ${{ secrets.VPS_DB_PATH }}
          LOCAL_DB_PATH: ${{ secrets.LOCAL_DB_PATH }}
        run: |
          # Sync only the database file
          rsync -az --progress \
            -e "ssh -p $VPS_PORT -i ~/.ssh/id_ed25519" \
            "$LOCAL_DB_PATH" "$VPS_USER@$VPS_HOST:$VPS_DB_PATH"

      - name: Deploy MCP service to VPS
        if: ${{ inputs.deploy_mcp }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_DB_PATH: ${{ secrets.VPS_DB_PATH }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DUCKDB_REMOTE_URL: ${{ secrets.DUCKDB_REMOTE_URL }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash << 'EOF'
          set -euo pipefail
          cd "${{ secrets.VPS_PATH }}"

          echo "🚀 Starting Terrorblade MCP Docker Compose..."
          
          # Create .env file with secrets
          cat > .env << ENVEOF
          DB_PATH=${{ secrets.VPS_DB_PATH }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          DUCKDB_REMOTE_URL=${{ secrets.DUCKDB_REMOTE_URL }}
          MOTHERDUCK_TOKEN=${{ secrets.MOTHERDUCK_TOKEN }}
          ENVEOF
          
          # Deploy MCP service
          docker compose -f docker/docker-compose.yml up -d --build mcp --remove-orphans
          docker image prune -f || true
          
          echo "✅ MCP service deployed successfully"
          EOF

      - name: Verify deployment
        if: ${{ inputs.deploy_mcp }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash << 'EOF'
          echo "📊 Container status:"
          docker ps --filter "name=terrorblade" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          
          echo ""
          echo "📋 Recent logs:"
          docker logs terrorblade-mcp --tail 20 2>&1 || true
          EOF
